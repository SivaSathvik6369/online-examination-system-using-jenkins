apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-exam-deployment
  labels:
    app: online-exam
    tier: frontend
    course: swe4008
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-exam
  template:
    metadata:
      labels:
        app: online-exam
        tier: frontend
    spec:
      containers:
      - name: online-exam-app
        image: online-examination-system:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http-web
        env:
        - name: PORT
          value: "5000"
        - name: KUBERNETES_DEPLOYED
          value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
